<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f8f4ec">
  <meta name="description" content="Limonatta Studio by Paulina Limón — fotografía, video y contenido para marcas.">
  <title>Limonatta Studio — by Paulina Limón</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,500&family=Italianno&family=Libre+Bodoni:wght@400;500;600&display=swap" rel="stylesheet">

  <style>
    :root {
      --cream: #f8f4ec;
      --cream-2: #f2e8d1;
      --pink: #e8a59c;
      --pink-dark: #d98f86;
      --ink: #201b18;
      --muted: #756960;
      --line: rgba(217, 143, 134, .48);
    }

    * { box-sizing: border-box; }
    html { scroll-behavior: smooth; }
    body {
      margin: 0;
      min-height: 100vh;
      background: var(--cream); /* sin imagen de fondo */
      color: var(--ink);
      font-family: "Cormorant Garamond", Georgia, serif;
      overflow-x: hidden;
    }

    .page {
      min-height: 100svh;
      display: grid;
      grid-template-rows: 1fr auto;
      position: relative;
      isolation: isolate;
    }

    .page::before,
    .page::after {
      content: "";
      position: fixed;
      inset-block: 0;
      width: 72px;
      z-index: -1;
      opacity: .78;
      background: repeating-linear-gradient(90deg, var(--cream-2) 0 16px, transparent 16px 28px);
      pointer-events: none;
    }
    .page::before { left: 0; }
    .page::after { right: 0; transform: scaleX(-1); }

    main {
      width: min(930px, calc(100% - 48px));
      margin: 0 auto;
      display: grid;
      place-items: center;
      padding: 72px 0 86px;
      text-align: center;
    }

    .hero {
      position: relative;
      width: 100%;
      padding: 20px 10px;
    }

    .sparkle {
      position: absolute;
      width: 34px;
      height: 34px;
      color: var(--pink);
      transform-origin: center;
      will-change: transform, opacity;
    }

    .sparkle.one {
      top: 6px;
      left: 10%;
      animation: sparkleOne 3.8s ease-in-out infinite;
    }

    .sparkle.two {
      right: 12%;
      bottom: 22px;
      width: 25px;
      height: 25px;
      animation: sparkleTwo 4.6s ease-in-out .7s infinite;
    }

    @keyframes sparkleOne {
      0%, 100% { transform: rotate(-8deg) scale(1); opacity: .72; }
      50% { transform: rotate(7deg) scale(1.14); opacity: 1; }
    }

    @keyframes sparkleTwo {
      0%, 100% { transform: rotate(10deg) scale(1); opacity: .68; }
      50% { transform: rotate(-5deg) scale(1.12); opacity: 1; }
    }

    .eyebrow {
      margin: 0 0 18px;
      color: var(--pink-dark);
      font-size: .82rem;
      letter-spacing: .18em;
      text-transform: uppercase;
      font-weight: 600;
    }

    .logo-wrap {
      width: min(430px, 62vw);
      margin: 0 auto 10px;
      color: var(--ink);
    }

    .logo-wrap svg {
      display: block;
      width: 100%;
      height: auto;
      fill: currentColor;
      margin: 0 auto 8px;
    }

    .studio-word {
      font-family: "Libre Bodoni", "Bodoni MT", Didot, serif;
      font-size: clamp(2.2rem, 5vw, 4rem);
      font-weight: 500;
      letter-spacing: .14em;
      line-height: .95;
      text-transform: uppercase;
    }

    .signature {
      margin: 0 0 26px;
      font-family: "Italianno", cursive;
      font-size: clamp(2rem, 4.2vw, 3.35rem);
      line-height: 1;
    }

    h1 {
      max-width: 680px;
      font-family: "Libre Bodoni", "Bodoni MT", Didot, serif;
      margin: 0 auto 18px;
      font-size: clamp(1.65rem, 3.6vw, 3.1rem);
      font-weight: 500;
      line-height: .98;
      letter-spacing: -.025em;
    }

    .intro {
      max-width: 560px;
      font-family: "Libre Bodoni", "Bodoni MT", Didot, serif;
      margin: 0 auto;
      color: var(--muted);
      font-size: clamp(1.05rem, 2vw, 1.25rem);
      line-height: 1.55;
    }

    .actions {
      display: flex;
      justify-content: center;
      flex-wrap: wrap;
      gap: 12px;
      margin-top: 34px;
    }

    .btn {
      min-width: 180px;
      min-height: 48px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      padding: 12px 22px;
      border-radius: 999px;
      border: 1px solid var(--pink);
      text-decoration: none;
      font-family: "Cormorant Garamond", Georgia, serif;
      font-size: 1rem;
      font-weight: 600;
      letter-spacing: .03em;
      transition: transform .2s ease, background-color .2s ease, color .2s ease, box-shadow .2s ease;
    }
    .btn svg { width: 18px; height: 18px; flex: 0 0 auto; }
    .btn.primary { background: var(--pink); color: white; box-shadow: 0 10px 28px rgba(217, 143, 134, .18); }
    .btn.secondary { background: rgba(255,255,255,.18); color: var(--pink-dark); }
    .btn:hover { transform: translateY(-2px); }
    .btn.primary:hover { background: var(--pink-dark); }
    .btn.secondary:hover { background: rgba(232,165,156,.10); }

    footer {
      width: min(1120px, calc(100% - 48px));
      margin: 0 auto;
      padding: 22px 0 28px;
      display: flex;
      justify-content: space-between;
      gap: 16px;
      border-top: 1px solid var(--line);
      color: var(--muted);
      font-size: .78rem;
      letter-spacing: .04em;
    }
    footer span:last-child { text-align: right; }

    @media (max-width: 760px) {
      .page::before, .page::after { width: 22px; opacity: .5; }
      main, footer { width: min(100% - 40px, 930px); }
      main { padding: 54px 0 64px; }
      .hero { padding-bottom: 64px; }
      .logo-wrap { width: min(360px, 80vw); }
      .actions { width: 100%; }
      .btn { width: min(100%, 320px); }
      .sparkle.two {
        right: 5%;
        bottom: 14px;
      }
      footer { flex-direction: column; align-items: center; text-align: center; }
      footer span:last-child { text-align: center; }
    }

    @media (prefers-reduced-motion: reduce) {
      * { scroll-behavior: auto !important; transition: none !important; }
      .sparkle { animation: none !important; }
      .sparkle.one { transform: rotate(-8deg); opacity: .85; }
      .sparkle.two { transform: rotate(10deg); opacity: .85; }
    }
  </style>
</head>
